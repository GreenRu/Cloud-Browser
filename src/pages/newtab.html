<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:;" />
    <title>New Tab</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      /* No grid, no cards, no letter tiles. Links are clouds at different
         distances, scattered across the sky, so nothing lines up and nothing
         reads as a launcher. Depth comes from size, opacity and shadow moving
         together. */

      /* This page gets its own sky rather than the pale surface the other
         built-in pages use: white clouds need something to be white against.
         Still lighter than the chrome's sky, so the page card's edge reads. */
      body {
        overflow: hidden;
        background: linear-gradient(180deg, #dceefc 0%, #eaf5fd 52%, #f6fbff 100%);
      }

      [data-theme="night"] body {
        background: linear-gradient(180deg, #1b2a45 0%, #142033 55%, #0f1928 100%);
      }

      .sky-page {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 900px;
        margin: 0 auto;
        padding: 46px 40px 34px;
      }

      .mark { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }

      .mark-cloud {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        color: var(--drift-far);
        animation: bob 7s ease-in-out infinite alternate;
      }

      @keyframes bob {
        from { transform: translateY(-3px); }
        to { transform: translateY(5px); }
      }

      .wordmark {
        margin: 0;
        font-family: var(--brand-font);
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: var(--text);
      }

      /* The sky the clouds hang in. Positions are percentages so the scatter
         survives the window changing shape. */
      .sky-field {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin: 18px 0 4px;
      }

      .slot {
        position: absolute;
        left: var(--x);
        top: var(--y);
        animation: drift var(--dur) ease-in-out var(--delay) infinite alternate;
      }

      @keyframes drift {
        from { transform: translate(-8px, 3px); }
        to { transform: translate(8px, -6px); }
      }

      .drift {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 54px;
        padding: 0 24px;
        border-radius: 999px;
        /* Opaque: the lobes overlap, and alpha would show every seam. */
        background: var(--card-solid);
        color: var(--text);
        font-size: 14.5px;
        font-weight: 600;
        white-space: nowrap;
        transform: scale(var(--s));
        opacity: var(--o);
        filter: drop-shadow(0 calc(4px * var(--s)) calc(9px * var(--s)) rgba(20, 45, 75, 0.18));
        transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 220ms ease, filter 220ms ease;
      }

      .drift:hover {
        transform: scale(calc(var(--s) * 1.08)) translateY(-3px);
        opacity: 1;
        filter: drop-shadow(0 10px 20px rgba(20, 45, 75, 0.26));
      }

      .drift:active { transform: scale(calc(var(--s) * 1.02)); }

      .drift-lobe {
        position: absolute;
        border-radius: 999px;
        background: inherit;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: -1;
      }

      .drift > *:not(.drift-lobe) { position: relative; z-index: 1; }

      .drift-icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
      }

      .drift-icon img { width: 20px; height: 20px; object-fit: contain; }
      .drift-icon svg { width: 18px; height: 18px; color: var(--drift-far); }
      /* A site whose icon would not load gets the browser's raining cloud. */
      .drift-icon.is-rain svg { color: #93a6bb; }

      /* The one cloud that is always there. Quieter than a shortcut - it is a
         way in, not a destination. */
      .drift.is-add { color: var(--text-dim); }
      .drift.is-add .drift-icon svg { width: 20px; height: 20px; color: currentColor; }
      .drift.is-add:hover { color: var(--text); }

      /* ---------- right-click a cloud ---------- */

      .sky-menu {
        position: fixed;
        z-index: 40;
        min-width: 168px;
        padding: 5px;
        border-radius: 13px;
        background: var(--card-solid);
        box-shadow: 0 14px 34px rgba(20, 45, 75, 0.26), 0 2px 6px rgba(20, 45, 75, 0.14);
        animation: menu-in 140ms cubic-bezier(0.22, 1.5, 0.4, 1) both;
      }

      .sky-menu[hidden] { display: none; }

      @keyframes menu-in {
        from { opacity: 0; transform: scale(0.94) translateY(-4px); }
        to { opacity: 1; transform: none; }
      }

      .sky-menu button {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border-radius: 9px;
        text-align: left;
        font-size: 13px;
        font-weight: 550;
        color: var(--text);
        transition: background 120ms ease, color 120ms ease;
      }

      .sky-menu button:hover { background: var(--card-hover); }
      .sky-menu button.is-remove:hover { background: rgba(214, 84, 84, 0.16); color: #d65454; }

      /* ---------- adding one ---------- */

      .sky-sheet {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: rgba(14, 32, 54, 0.32);
        animation: sheet-in 160ms ease both;
      }

      .sky-sheet[hidden] { display: none; }

      @keyframes sheet-in { from { opacity: 0; } to { opacity: 1; } }

      .sky-sheet form {
        width: min(370px, calc(100vw - 48px));
        padding: 22px;
        border-radius: 22px;
        background: var(--card-solid);
        box-shadow: 0 24px 60px rgba(14, 32, 54, 0.38);
        animation: menu-in 220ms cubic-bezier(0.22, 1.5, 0.4, 1) both;
      }

      .sky-sheet h2 {
        margin: 0 0 14px;
        font-family: var(--brand-font);
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
      }

      .sky-sheet label {
        display: block;
        margin-bottom: 11px;
        font-size: 11.5px;
        font-weight: 650;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      .sky-sheet input {
        display: block;
        width: 100%;
        margin-top: 5px;
        height: 38px;
        padding: 0 13px;
        border: 1.5px solid var(--card-hover);
        border-radius: 11px;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        text-transform: none;
        letter-spacing: 0;
        outline: none;
        transition: border-color 140ms ease;
      }

      .sky-sheet input:focus { border-color: var(--accent); }

      .sheet-row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }

      .sheet-row button {
        height: 34px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 650;
        color: var(--text-dim);
        transition: background 140ms ease, color 140ms ease, transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .sheet-row button:hover { background: var(--card-hover); color: var(--text); }

      .sheet-row button[type="submit"] {
        background: var(--accent);
        color: #fff;
      }

      .sheet-row button[type="submit"]:hover { transform: translateY(-1px); filter: brightness(1.06); }

      /* ---------- the ground: search, with its own bubble above ---------- */

      .ground { flex: 0 0 auto; position: relative; }

      /* The bubble is only a frame. Its interior is reported to the browser,
         which parks a real view of the destination over that rect - so what
         you see above the search bar is the page itself, not a description of
         it. Same trick as the address bar's bubble. */
      .ask-bubble {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 34px);
        transform: translateX(-50%);
        width: min(520px, calc(100vw - 72px));
        padding: 4px 12px 12px;
        border-radius: 22px;
        background: var(--card-solid);
        box-shadow: 0 12px 28px rgba(20, 45, 75, 0.22), 0 3px 7px rgba(20, 45, 75, 0.12);
        animation: bubble-in 320ms cubic-bezier(0.22, 1.7, 0.36, 1) both;
      }

      .ask-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px 9px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      .ask-hint {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: var(--text-dim);
      }

      /* Held open at the size the view will fill. The radius matches the one
         the browser rounds that view to. */
      .ask-screen {
        height: 250px;
        border-radius: 15px;
        background: var(--card-hover);
        overflow: hidden;
      }

      .ask-bubble[hidden] { display: none; }

      @keyframes bubble-in {
        from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.9); }
        to { opacity: 1; transform: translateX(-50%); }
      }

      .ask-head #ask-target {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ask-arrow { width: 16px; height: 16px; flex: 0 0 auto; color: var(--accent); }

      /* The tail, rising from the search bar into the bubble. */
      .ask-puff {
        position: absolute;
        left: 50%;
        border-radius: 50%;
        background: var(--card-solid);
        box-shadow: 0 2px 5px rgba(20, 45, 75, 0.16);
        transform: translateX(-50%);
        animation: puff-breathe var(--dur) ease-in-out var(--delay) infinite alternate;
      }

      .ask-puff[hidden] { display: none; }
      .ask-puff-1 { width: 9px;  height: 9px;  bottom: calc(100% + 8px);  margin-left: -26px; --dur: 2.6s; --delay: 0s; }
      .ask-puff-2 { width: 14px; height: 14px; bottom: calc(100% + 18px); margin-left: -14px; --dur: 3.4s; --delay: -0.8s; }

      @keyframes puff-breathe {
        from { transform: translateX(-50%) scale(0.78); }
        to { transform: translateX(-50%) scale(1.15); }
      }

      .ask {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 10px 0 24px;
        border-radius: 999px;
        background: var(--card-solid);
        box-shadow: 0 6px 18px rgba(20, 45, 75, 0.16);
        transition: box-shadow 240ms ease, transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .ask:focus-within {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(20, 45, 75, 0.22);
      }

      .ask-lobe {
        position: absolute;
        border-radius: 999px;
        background: inherit;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: -1;
      }

      .ask > *:not(.ask-lobe) { position: relative; z-index: 1; }

      .ask input {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        border: 0;
        outline: none;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 15px;
      }

      .ask input::placeholder { color: var(--text-dim); }

      .ask button {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--text-dim);
        transition: background 160ms ease, color 160ms ease, transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .ask button:hover { background: var(--card-hover); color: var(--text); transform: scale(1.1); }
      .ask button svg { width: 19px; height: 19px; }

      .recent-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 3px 22px;
        margin-top: 16px;
        min-height: 18px;
      }

      .recent-link {
        max-width: 200px;
        color: var(--text-dim);
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border-bottom: 1px solid transparent;
        transition: color 140ms ease, border-color 140ms ease;
      }

      .recent-link:hover { color: var(--text); border-bottom-color: currentColor; }

      @media (max-height: 620px) {
        .recent-list { display: none; }
        .sky-page { padding-top: 30px; }
      }
    </style>
  </head>
  <body>
    <main class="sky-page">
      <header class="mark">
        <svg class="mark-cloud" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M6.5 18h11a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 8.6 4.2 4.2 0 0 0 6.5 18Z" />
        </svg>
        <h1 class="wordmark">Stratus</h1>
      </header>

      <section class="sky-field" id="sky-field"></section>

      <!-- Right-clicking a cloud. Drawn by the page rather than the browser:
           these are the page's own objects, and nothing else knows about them. -->
      <div class="sky-menu" id="sky-menu" hidden role="menu">
        <button type="button" id="menu-open" role="menuitem">Open in a new cloud</button>
        <button type="button" id="menu-remove" class="is-remove" role="menuitem">Remove from the sky</button>
      </div>

      <div class="sky-sheet" id="sky-sheet" hidden>
        <form id="sky-add-form">
          <h2>Add a cloud</h2>
          <label>
            Address
            <input type="text" id="add-url" placeholder="example.com" autocomplete="off" spellcheck="false" />
          </label>
          <label>
            Name <span style="text-transform: none; font-weight: 500;">(optional)</span>
            <input type="text" id="add-label" placeholder="Taken from the address" autocomplete="off" />
          </label>
          <div class="sheet-row">
            <button type="button" id="add-cancel">Cancel</button>
            <button type="submit">Add</button>
          </div>
        </form>
      </div>

      <footer class="ground">
        <span class="ask-puff ask-puff-1" id="ask-puff-1" hidden></span>
        <span class="ask-puff ask-puff-2" id="ask-puff-2" hidden></span>

        <div class="ask-bubble" id="ask-bubble" hidden>
          <div class="ask-head">
            <span class="ask-arrow" data-icon="arrow-right"></span>
            <span id="ask-target"></span>
            <span class="ask-hint">Enter to open</span>
          </div>
          <!-- The browser parks a live view of the destination over this. -->
          <div class="ask-screen" id="ask-screen"></div>
        </div>

        <form class="ask" id="ask-form">
          <input id="ask" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Search the sky, or type an address" aria-label="Search or type an address" />
          <button type="submit" aria-label="Go">
            <span data-icon="arrow-right"></span>
          </button>
        </form>

        <div class="recent-list" id="recent-list"></div>
      </footer>
    </main>

    <script src="../shared/clouds.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="../shared/theme.js"></script>
    <script src="../shared/stars.js"></script>
    <script src="../shared/birds.js"></script>
    <script src="./newtab.js"></script>
  </body>
</html>
