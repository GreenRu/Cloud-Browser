<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:;" />
    <title>New Tab</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      /* No grid, no cards, no letter tiles. Links are clouds at different
         distances, scattered across the sky, so nothing lines up and nothing
         reads as a launcher. Depth comes from size, opacity and shadow moving
         together. */

      /* This page gets its own sky rather than the pale surface the other
         built-in pages use: white clouds need something to be white against.
         Still lighter than the chrome's sky, so the page card's edge reads. */
      body {
        overflow: hidden;
        background: linear-gradient(180deg, #c7e1f7 0%, #ddeefb 46%, #f0f7fd 100%);
      }

      [data-theme="night"] body {
        background: linear-gradient(180deg, #16233a 0%, #101a2c 55%, #0b1220 100%);
      }

      .sky-page {
        position: relative;
        min-height: 100vh;
        max-width: 860px;
        margin: 0 auto;
        padding: 54px 40px 40px;
      }

      .mark { display: flex; align-items: center; gap: 14px; }

      .mark-cloud {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        color: var(--drift-far);
        animation: bob 7s ease-in-out infinite alternate;
      }

      @keyframes bob {
        from { transform: translateY(-3px); }
        to { transform: translateY(5px); }
      }

      .wordmark {
        margin: 0;
        font-family: var(--brand-font);
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.4px;
        color: var(--text);
      }

      /* The sky the clouds hang in. Absolute positions so they can be
         scattered rather than flowed into rows. */
      .sky-field {
        position: relative;
        height: 330px;
        margin-top: 26px;
      }

      .slot {
        position: absolute;
        left: var(--x);
        top: var(--y);
        animation: drift var(--dur) ease-in-out var(--delay) infinite alternate;
      }

      @keyframes drift {
        from { transform: translate(-7px, 2px); }
        to { transform: translate(7px, -5px); }
      }

      .drift {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 42px;
        padding: 0 18px;
        border-radius: 999px;
        /* Opaque: the lobes overlap, and alpha would show every seam. */
        background: var(--card-solid);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        transform: scale(var(--s));
        opacity: var(--o);
        filter: drop-shadow(0 calc(3px * var(--s)) calc(7px * var(--s)) rgba(20, 45, 75, 0.18));
        transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 220ms ease, filter 220ms ease;
      }

      .drift:hover {
        transform: scale(calc(var(--s) * 1.09)) translateY(-3px);
        opacity: 1;
        filter: drop-shadow(0 8px 16px rgba(20, 45, 75, 0.26));
      }

      .drift:active { transform: scale(calc(var(--s) * 1.02)); }

      .drift-lobe {
        position: absolute;
        border-radius: 999px;
        background: inherit;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: -1;
      }

      .drift > *:not(.drift-lobe) { position: relative; z-index: 1; }

      .drift-icon {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
      }

      .drift-icon img { width: 17px; height: 17px; object-fit: contain; }
      .drift-icon svg { width: 15px; height: 15px; color: var(--drift-far); }

      /* Recently visited, set as quiet type rather than another row of cards. */
      .recent {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 34px;
      }

      .recent-head {
        margin: 0 0 9px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--text-dim);
        opacity: 0.75;
      }

      .recent-list { display: flex; flex-wrap: wrap; gap: 4px 20px; }

      .recent-link {
        max-width: 220px;
        padding: 2px 0;
        color: var(--text-dim);
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border-bottom: 1px solid transparent;
        transition: color 140ms ease, border-color 140ms ease;
      }

      .recent-link:hover { color: var(--text); border-bottom-color: currentColor; }

      @media (max-height: 560px) {
        .sky-field { height: 210px; }
        .recent { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="sky-page">
      <header class="mark">
        <svg class="mark-cloud" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M6.5 18h11a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 8.6 4.2 4.2 0 0 0 6.5 18Z" />
        </svg>
        <h1 class="wordmark">Stratus</h1>
      </header>

      <section class="sky-field" id="sky-field"></section>

      <footer class="recent" id="recent" hidden>
        <h2 class="recent-head">Recently visited</h2>
        <div class="recent-list" id="recent-list"></div>
      </footer>
    </main>

    <script src="../shared/clouds.js"></script>
    <script src="./newtab.js"></script>
  </body>
</html>
