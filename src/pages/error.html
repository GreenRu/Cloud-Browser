<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>Page unavailable</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      body { display: grid; place-items: center; }

      .panel {
        width: min(520px, calc(100vw - 48px));
        padding: 40px 36px;
        text-align: center;
        border: 1px solid var(--card-line);
        border-radius: 24px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .rain {
        width: 84px;
        height: 84px;
        margin: 0 auto 12px;
        color: var(--text-dim);
        opacity: 0.7;
      }

      .rain svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }

      h1 { margin: 0 0 8px; font-family: var(--brand-font); font-size: 21px; }
      p { margin: 0 0 6px; color: var(--text-dim); font-size: 13.5px; line-height: 1.55; }
      .url { margin: 14px 0 22px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; color: var(--text); }
      .code { font-size: 11.5px; letter-spacing: 0.4px; text-transform: uppercase; }

      .actions { display: flex; gap: 10px; justify-content: center; }
      .primary {
        padding: 9px 20px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="rain">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 15h11a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 5.6 4.2 4.2 0 0 0 6.5 15Z" />
          <path d="M8.5 18.5 7.5 21M12 18.5 11 21M15.5 18.5 14.5 21" />
        </svg>
      </div>
      <h1>This cloud didn't load</h1>
      <p id="description">The page could not be reached.</p>
      <p class="code" id="code"></p>
      <p class="url" id="url"></p>
      <div class="actions">
        <button class="primary" id="retry">Try again</button>
        <button class="ghost-btn" id="home">New tab</button>
      </div>
    </main>
    <script src="./error.js"></script>
  </body>
</html>
